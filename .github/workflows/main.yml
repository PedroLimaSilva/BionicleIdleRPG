name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  # Skip Test / E2E / Build when the diff only touches Markdown (docs, README, etc.)
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.docs_only.outputs.docs_only }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect docs-only diff
        id: docs_only
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t files < <(git diff --name-only "$BASE" "$HEAD")
          if [ ${#files[@]} -eq 0 ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for f in "${files[@]}"; do
            case "$f" in
              *.md) ;;
              *)
                echo "docs_only=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done
          echo "docs_only=true" >> "$GITHUB_OUTPUT"

  docs-only:
    name: Docs only (CI skipped)
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Markdown-only change; Test, E2E, and Build were skipped."

  # Job 1: Run tests and linting
  test:
    name: Test & Lint
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linter
        run: yarn lint

      - name: Check formatting
        run: yarn format:check

      - name: Run tests
        run: yarn test:ci

  # Job 2a: E2E app/UI tests (fast — no 3D model golden masters)
  e2e-app:
    name: E2E App Tests
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright app tests
        run: yarn test:e2e:app

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-app
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-results-app
          path: test-results/
          retention-days: 30

  # Job 2b: E2E 3D model rendering (slow — canvas snapshots for every character)
  e2e-models:
    name: E2E Model Rendering
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build production bundle
        run: yarn build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright model rendering tests
        run: yarn test:e2e:models
        env:
          E2E_USE_PREVIEW: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-models
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-results-models
          path: test-results/
          retention-days: 30

  # Job 3: Build (depends on tests passing)
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [changes, test, e2e-app, e2e-models]
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      needs.test.result == 'success' &&
      needs.e2e-app.result == 'success' &&
      needs.e2e-models.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build project
        run: yarn build

      - name: Check for unused CSS
        run: yarn check:unused-css

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ./dist
          retention-days: 1

  # Job 3: Deploy to GitHub Pages (only on master, depends on build)
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: >-
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push' &&
      needs.changes.outputs.docs_only != 'true' &&
      needs.build.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
