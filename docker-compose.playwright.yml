services:
  playwright:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    volumes:
      # Full project mount — Colima often fails to sync single-file binds (stale playwright.config.ts).
      - .:/app
      - /app/node_modules
    environment:
      - CI=true
      - PLAYWRIGHT_DOCKER=true
    extra_hosts:
      - 'host.docker.internal:host-gateway'
